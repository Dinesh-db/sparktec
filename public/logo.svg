<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic & Steel Gradients -->
    <linearGradient id="primarySteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C4E80" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#E8A020" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A020" />
      <stop offset="100%" stop-color="#1C4E80" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Badge Background -->
  <polygon points="250,30 430,110 430,370 250,470 70,370 70,110" fill="url(#primarySteel)" stroke="url(#shieldBorder)" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Outer Rail Track Lines -->
  <path d="M 160 410 L 220 270 M 340 410 L 280 270" stroke="#E8A020" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="180" y1="370" x2="320" y2="370" stroke="#E8A020" stroke-width="6" opacity="0.6"/>
  <line x1="200" y1="320" x2="300" y2="320" stroke="#E8A020" stroke-width="6" opacity="0.6"/>

  <!-- Locomotive Front Geometry -->
  <!-- Cab Top / Roof -->
  <polygon points="180,140 250,110 320,140 310,180 190,180" fill="#E8EDF2" opacity="0.95"/>
  <!-- Windshield Grid -->
  <polygon points="200,150 245,135 245,170 205,170" fill="#0D1B2A"/>
  <polygon points="255,135 300,150 295,170 255,170" fill="#0D1B2A"/>
  
  <!-- Body / Grill Frame -->
  <polygon points="170,190 330,190 340,300 160,300" fill="#1C4E80" stroke="#E8A020" stroke-width="4"/>
  
  <!-- Heavy Duty Cattle Guard / Cowcatcher (Bottom) -->
  <polygon points="140,340 250,300 360,340 380,380 120,380" fill="#08111B" stroke="#E8EDF2" stroke-width="3"/>
  <line x1="180" y1="340" x2="160" y2="380" stroke="#E8A020" stroke-width="4"/>
  <line x1="220" y1="320" x2="210" y2="380" stroke="#E8A020" stroke-width="4"/>
  <line x1="280" y1="320" x2="290" y2="380" stroke="#E8A020" stroke-width="4"/>
  <line x1="320" y1="340" x2="340" y2="380" stroke="#E8A020" stroke-width="4"/>

  <!-- Center Headlight / Power Spark Core -->
  <circle cx="250" cy="245" r="32" fill="url(#amberGold)" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Spark Bolt Symbol in Center -->
  <path d="M 252 225 L 235 248 L 250 248 L 246 265 L 265 242 L 250 242 Z" fill="#0D1B2A"/>
</svg>
